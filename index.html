<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="./images/favicon.png">
  <title>Orange BOT Cable - Asad's Team</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav class="navbar glass-nav">
  <div class="nav-left">
    <img src="./images/logo.png" alt="Logo" class="nav-logo" />
    <span class="nav-title">BOT Cable</span>
  </div>

  <div class="nav-right">
    <button id="exportBtn" class="glass-button">Export</button>
    <button id="importBtn" class="glass-button">Import</button>
    <a href="incident.html"><button class="glass-button">Incident</button></a>
    <input type="file" id="importFile" accept="application/json" hidden />

    <a href="dashboard.html" class="glass-link">
      Dashboard
    </a>
  </div>
</nav>


  <div class="wrap">
    <header>
      <div class="controls">
        <input id="search" type="search" placeholder="Search notes…" />
        <button id="showForm" title="Add note" class="glass-button">➕ Add Note</button>
      </div>
    </header>
    <form id="noteForm" autocomplete="off">
      <div class="row">
        <input id="noteCC" placeholder="CC (Customer Code)" />
        <input id="noteTitle" list="presetTitles" placeholder="Case (choose or type…)" required />
      </div>
      <div class="row">
        <textarea id="noteContent" placeholder="Content"></textarea>
      </div>
      <div class="row" style="justify-content:flex-end">
        <button type="submit">Save Note</button>
      </div>
    </form>
    <datalist id="presetTitles"></datalist>

    <main id="notesGrid" aria-live="polite"></main>
  </div>



<!-- Your notes JS remains the same as before -->
<script src="app.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ingress Follow-up</title>

  <link rel="stylesheet" href="style.css">

  <style>
    /* ===============================
       TOOLBAR
    =============================== */
    .ingress-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .ingress-counter-card {
      backdrop-filter: var(--blur);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 6px 12px;
      box-shadow: var(--shadow);
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .ingress-counter-card strong {
      font-size: 1rem;
      margin-right: 4px;
    }

    /* ===============================
       LIST
    =============================== */
    .ingress-list {
      margin-top: 18px;
    }

    .ingress-cc {
      padding: 14px 4px;
    }

    .ingress-cc:last-child {
      border-bottom: none;
    }

    /* ===============================
       CC HEADER
    =============================== */
    .ingress-header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      cursor: pointer;
    }

    .ingress-header strong {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .ingress-meta {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ===============================
       CLEAN TIMELINE
    =============================== */
    .timeline {
      position: relative;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      align-items: center;
      margin: 8px 0 4px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 2px;
      background: var(--panel-border);
      transform: translateY(-50%);
    }

    .timeline-step {
      position: relative;
      text-align: center;
      cursor: pointer;
    }

    .timeline-dot {
      width: 8px;
      height: 8px;
      margin: 0 auto;
      border-radius: 50%;
      background: var(--panel-border);
      position: relative;
      z-index: 1;
      transition: all 0.2s ease;
    }

    .timeline-step.done .timeline-dot {
      background: #1a7f37;
    }

    .timeline-step.active .timeline-dot {
      background: #0969da;
      box-shadow: 0 0 0 3px rgba(9,105,218,0.25);
    }

    .timeline-step::after {
      content: attr(data-label);
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.65rem;
      color: var(--muted);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.15s ease;
      pointer-events: none;
    }

    .timeline-step:hover::after {
      opacity: 1;
    }

    /* ===============================
       THREAD
    =============================== */
    .ingress-thread {
      margin-left: 10px;
      padding-left: 14px;
      border-left: 2px solid var(--panel-border);
      margin-top: 8px;
      display: none;
    }

    .ingress-cc.open .ingress-thread {
      display: block;
    }

    /* ===============================
       NOTES
    =============================== */
    .ingress-note {
      padding: 10px 0;
    }

    .ingress-note time {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .ingress-note div {
      line-height: 1.55;
      max-width: 900px;
    }
  </style>
</head>

<body>

<nav class="navbar glass-nav">
  <div class="nav-left">
    <img src="./images/logo.png" class="nav-logo" />
    <span class="nav-title">Ingress Follow-up</span>
  </div>
  <div class="nav-right">
    <a href="index.html"><button class="glass-button">Cases</button></a>
    <a href="incident.html"><button class="glass-button">Incident</button></a>
    <a href="dashboard.html" class="glass-link">Dashboard</a>
  </div>
</nav>

<div class="wrap">

  <header>
    <div class="controls ingress-toolbar">
      <input id="ingressSearch" type="search"
        placeholder="Search CC or keyword (TLN, Duo, filter…)" />
      <div id="ccCounter" class="ingress-counter-card"></div>
    </div>
  </header>

  <div id="ingressList" class="ingress-list"></div>
</div>

<script>
const NOTES_KEY = "notes_v1";
const STATUS_KEY = "ingress_status";

const STATUS_STEPS = [
  "Created",
  "Customer contacted",
  "Duo repair planned",
  "Awaiting TLN/Wyre",
  "Appointment done",
  "Verification pending",
  "Closed"
];

const listEl = document.getElementById("ingressList");
const searchInput = document.getElementById("ingressSearch");
const counterEl = document.getElementById("ccCounter");

function parseDate(v) {
  if (v === null || v === undefined || v === "") return null;
  if (!isNaN(v)) {
    const d = new Date(Number(v));
    return isNaN(d) ? null : d;
  }
  const d = new Date(v);
  return isNaN(d) ? null : d;
}

function loadNotes() {
  return (JSON.parse(localStorage.getItem(NOTES_KEY)) || []).filter(
    n => n && n.cc && n.title &&
    String(n.title).toLowerCase().includes("ingress")
  );
}

function loadStatus() {
  return JSON.parse(localStorage.getItem(STATUS_KEY)) || {};
}

function saveStatus(map) {
  localStorage.setItem(STATUS_KEY, JSON.stringify(map));
}

function render() {
  const notes = loadNotes();
  const statusMap = loadStatus();
  const q = searchInput.value.toLowerCase();

  const grouped = {};
  notes.forEach(n => {
    if (!grouped[n.cc]) grouped[n.cc] = [];
    grouped[n.cc].push(n);
  });

  listEl.innerHTML = "";
  let count = 0;

  Object.entries(grouped).forEach(([cc, thread]) => {
    if (
      q &&
      !cc.toLowerCase().includes(q) &&
      !thread.some(n => n.content.toLowerCase().includes(q))
    ) return;

    count++;

    thread.sort((a,b)=>{
      const da = parseDate(a.createdAt);
      const db = parseDate(b.createdAt);
      if (!da && !db) return 0;
      if (!da) return -1;
      if (!db) return 1;
      return da - db;
    });

    const current = statusMap[cc] ?? 0;

    const ccEl = document.createElement("section");
    ccEl.className = "ingress-cc";

    ccEl.innerHTML = `
      <div class="ingress-header">
        <strong>CC ${cc}</strong>
        <span class="ingress-meta">${thread.length} follow-ups</span>
      </div>

      <div class="timeline">
        ${STATUS_STEPS.map((s,i)=>`
          <div class="timeline-step
            ${i < current ? "done" : ""}
            ${i === current ? "active" : ""}"
            data-step="${i}"
            data-label="${s}">
            <div class="timeline-dot"></div>
          </div>`).join("")}
      </div>

      <div class="ingress-thread">
        ${thread.map(n=>{
          const d = parseDate(n.createdAt);
          return `
            <div class="ingress-note">
              <time>${d ? d.toLocaleString() : ""}</time>
              <div>${n.content.replace(/\n/g,"<br>")}</div>
            </div>`;
        }).join("")}
      </div>
    `;

    ccEl.querySelectorAll(".timeline-step").forEach(step=>{
      step.onclick = e => {
        statusMap[cc] = Number(step.dataset.step);
        saveStatus(statusMap);
        render();
        e.stopPropagation();
      };
    });

    ccEl.querySelector(".ingress-header").onclick =
      () => ccEl.classList.toggle("open");

    listEl.appendChild(ccEl);
  });

  counterEl.innerHTML = `<strong>${count}</strong> Ingress Cases`;
}

searchInput.addEventListener("input", render);
window.addEventListener("storage", render);
render();
</script>

</body>
</html>
